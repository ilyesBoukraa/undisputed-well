worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen 80;
        server_name _;

        # Same-origin architecture: the SPA and the API are served from the same
        # origin through this single proxy, so the browser never needs CORS and
        # the session cookie's SameSite=Strict setting works without friction.

        location /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SSE alert stream: nginx buffers proxied responses by default, which
        # holds back every chunk (including the connection-opening one)
        # until the buffer fills or the upstream closes — defeating a
        # long-lived streaming response entirely. proxy_buffering off fixes
        # that. proxy_read_timeout is raised because the backend only writes
        # when there's something to say (plus a keepalive comment — see
        # api/operations.py) rather than on a fixed short cadence, so the
        # default 60s idle timeout would otherwise kill a quiet connection.
        location /api/operations/alerts/stream {
            proxy_pass http://backend:8000/api/operations/alerts/stream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }

        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
