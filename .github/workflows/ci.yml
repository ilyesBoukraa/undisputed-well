name: CI

# Pipeline per PLAN.md's M7 decision: Jest+RTL with its Istanbul coverage
# gate, and pytest with its coverage gate, run first (cheap, fast feedback,
# no Docker needed — both test suites are self-contained, pytest against an
# in-memory SQLite DB). The e2e job then builds and starts the real Docker
# Compose stack and runs Playwright against it — this doubles as the
# `docker compose build && up` smoke test, since the stack has to actually
# come up healthy for e2e to run at all.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend (Jest + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      - name: Jest (Istanbul coverage gate enforced by jest.config.cjs)
        run: npm run test:coverage

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: pytest (coverage gate enforced by pyproject.toml's fail_under)
        run: pytest --cov=app --cov-report=term-missing

  e2e:
    name: Docker Compose smoke test + Playwright e2e
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the full stack
        run: docker compose up -d --build --wait

      - name: Apply migrations
        run: docker compose exec -T backend alembic upgrade head

      - name: Seed admin and viewer accounts (see README)
        run: |
          docker compose exec -T backend python -m scripts.seed_admin admin@undisputedwell.dev "correct horse battery staple"
          docker compose exec -T backend python -m scripts.seed_user viewer@undisputedwell.dev "correct horse battery staple" viewer

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps and Playwright browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Playwright e2e (headless by default in CI)
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
